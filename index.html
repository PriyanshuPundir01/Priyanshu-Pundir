<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Priyanshu Pundir -- Full Stack Developer</title>
  <meta name="description"
    content="Priyanshu Pundir -- Full Stack Developer skilled in Java, JavaScript (React, Angular), Python, and SQL with hands-on experience across the SDLC, AI RAG platforms, and secure architectures." />
  <script>
    try {
      const saved = localStorage.getItem('portfolio-theme') || 'dark';
      if (saved === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      }
    } catch (e) {}
  </script>
  <!-- Google Fonts Kanit 300-900 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
</head>
